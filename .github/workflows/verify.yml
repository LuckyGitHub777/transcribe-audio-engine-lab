name: Verify transcription engine mock contract
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout source without token persistence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify released hashes
        run: sha256sum --check --strict MANIFEST.sha256
      - name: Test mocked engine without model downloads
        run: |
          python tests/test_engine_mock.py
          python tests/test_probe_mock.py
          python -m compileall -q app
